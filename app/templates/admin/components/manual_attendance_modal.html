<!-- Modal Dialog Catat Presensi Manual (Pusat Operasional Dashboard) -->
<dialog id="manual-attendance-dialog">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h3 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--text);">Catat Presensi Manual</h3>
        <p style="margin: 0.25rem 0 0 0; font-size: 0.85rem; color: var(--text-muted);">
          Input kehadiran, izin, sakit, atau kepulangan anak tanpa scan kartu RFID.
        </p>
      </div>
      <button type="button" class="modal-close-btn" id="btn-close-manual-modal" aria-label="Tutup Dialog">✕</button>
    </div>

    <form method="post" action="/admin/absensi-manual" id="form-manual-attendance" class="manual-modal-form">
      <input type="hidden" name="return_to" value="dashboard">
      <input type="hidden" name="status_pulang" id="manual-status-pulang" value="">
      <input type="hidden" name="denda_menit" id="manual-denda-menit" value="0">

      <div class="manual-modal-body">
        <div class="manual-modal-grid">
          <!-- Baris 1: Kolom Anak dan Tanggal (2 Kolom) -->
          <label class="col-span-3">Anak
            <select name="student_id" id="manual-student-select" required>
              <option value="">-- Pilih Anak --</option>
              {% for row in rows %}
                {% if row.aktif %}
                  <option value="{{ row.id }}">
                    {{ row.nama }}{% if row.nomor_urut %} (No. {{ row.nomor_urut }}){% endif %} - {{ "Paket A (Half Day)" if row.paket == 'A' else "Paket B (Full Day)" }}
                  </option>
                {% endif %}
              {% endfor %}
            </select>
          </label>

          <label class="col-span-3">Tanggal
            <div style="position: relative; display: flex; align-items: center; width: 100%;">
              <input 
                type="text" 
                id="manual-tanggal-display" 
                name="tanggal"
                placeholder="DD/MM/YYYY" 
                maxlength="10" 
                autocomplete="off"
                value="{{ today_formatted }}"
                style="width: 100%; padding-right: 2.75rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 0;"
                title="Ketik tanggal (DD/MM/YYYY) atau klik ikon kalender di kanan"
                required
              >
              <button 
                type="button" 
                id="btn-open-calendar-picker"
                title="Buka kalender visual" 
                aria-label="Pilih tanggal dari kalender"
                style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 0.35rem; margin: 0; cursor: pointer; color: #718096; display: flex; align-items: center; justify-content: center; width: auto; height: auto;"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
            </div>
          </label>

          <!-- Baris 2: Status Kehadiran (Kolom Kanan Kosong / Spacer) -->
          <label class="col-span-3">Status Hadir
            <select name="status" id="manual-status-select">
              <option value="Hadir">Hadir</option>
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
              <option value="Alpha">Alpha</option>
            </select>
          </label>
          <div class="col-span-3 form-spacer" aria-hidden="true"></div>

          <!-- Baris 3: Jam Masuk, Nama Pengantar, Alasan Masuk Tanpa Kartu (3 Kolom) -->
          <label class="col-span-2">Jam Masuk (24 Jam)
            <input 
              type="text" 
              name="waktu" 
              id="manual-jam-masuk"
              class="input-jam-24" 
              placeholder="07.00" 
              maxlength="5" 
              autocomplete="off"
              style="font-family: inherit; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0;"
              title="Format 24 jam: 00.00 s/d 23.59"
            >
          </label>

          <div class="form-group-combo dropdown-with-custom col-span-2">
            <label>Nama Pengantar</label>
            <select name="nama_pengantar" id="manual-select-pengantar">
              <option value="">-- Pilih Pengantar --</option>
              <option value="Ayah">Ayah</option>
              <option value="Ibu">Ibu</option>
              <option value="Lainnya">Lainnya</option>
            </select>
            <input type="text" class="input-custom-text" name="nama_pengantar_lainnya" id="manual-input-pengantar-lainnya" placeholder="Ketik nama pengantar..." style="display: none; margin-top: 0.35rem;">
          </div>

          <label class="col-span-2">Alasan Masuk Tanpa Kartu
            <input type="text" name="alasan_tanpa_kartu" id="manual-alasan-masuk" placeholder="Cth: Kartu anak tertinggal">
          </label>

          <!-- Baris 4: Jam Pulang, Nama Penjemput, Alasan Penjemputan Tanpa Kartu (3 Kolom) -->
          <label class="col-span-2">Jam Pulang (24 Jam)
            <input 
              type="text" 
              name="waktu_pulang" 
              id="manual-jam-pulang"
              class="input-jam-24" 
              placeholder="13.00" 
              maxlength="5" 
              autocomplete="off"
              style="font-family: inherit; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0;"
              title="Format 24 jam: 00.00 s/d 23.59"
            >
          </label>

          <div class="form-group-combo dropdown-with-custom col-span-2">
            <label>Nama Penjemput</label>
            <select name="nama_penjemput" id="manual-select-penjemput">
              <option value="">-- Pilih Penjemput --</option>
              <option value="Ayah">Ayah</option>
              <option value="Ibu">Ibu</option>
              <option value="Lainnya">Lainnya</option>
            </select>
            <input type="text" class="input-custom-text" name="nama_penjemput_lainnya" id="manual-input-penjemput-lainnya" placeholder="Ketik nama penjemput..." style="display: none; margin-top: 0.35rem;">
          </div>

          <label class="col-span-2">Alasan Penjemputan Tanpa Kartu
            <input type="text" name="alasan_penjemputan_tanpa_kartu" id="manual-alasan-pulang" placeholder="Cth: Kartu penjemput tertinggal">
          </label>

          <!-- Baris 5: Catatan Tambahan (Form Besar / Textarea 100%) -->
          <label class="col-span-6">Catatan Tambahan
            <textarea 
              name="catatan" 
              id="manual-catatan" 
              rows="3" 
              placeholder="Catatan tambahan (opsional)..."
            ></textarea>
          </label>
        </div>
      </div>

      <!-- Tombol Aksi di Bagian Bawah (Tetap Terlihat / Pinned Footer) -->
      <div class="modal-actions-bar">
        <button type="button" class="btn-sm btn-secondary" id="btn-cancel-manual-modal">Batal</button>
        <button type="submit" class="btn-sm btn-primary" style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0 1.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Simpan Presensi Manual
        </button>
      </div>
    </form>
  </div>
</dialog>

<script>
(() => {
  const modal = document.querySelector("#manual-attendance-dialog");
  const openBtn = document.querySelector("#btn-open-manual-modal");
  const closeBtn = document.querySelector("#btn-close-manual-modal");
  const cancelBtn = document.querySelector("#btn-cancel-manual-modal");
  const calBtn = document.querySelector("#btn-open-calendar-picker");

  if (!modal) return;

  const studentSelect = modal.querySelector("#manual-student-select");
  const dateInput = document.getElementById("manual-tanggal-display");
  const statusSelect = modal.querySelector("#manual-status-select");
  const jamMasukInput = modal.querySelector("#manual-jam-masuk");
  const jamPulangInput = modal.querySelector("#manual-jam-pulang");
  const pengantarSelect = modal.querySelector("#manual-select-pengantar");
  const pengantarLainnyaInput = modal.querySelector("#manual-input-pengantar-lainnya");
  const penjemputSelect = modal.querySelector("#manual-select-penjemput");
  const penjemputLainnyaInput = modal.querySelector("#manual-input-penjemput-lainnya");
  const alasanMasukInput = modal.querySelector("#manual-alasan-masuk");
  const alasanPulangInput = modal.querySelector("#manual-alasan-pulang");
  const catatanTextarea = modal.querySelector("#manual-catatan");
  const statusPulangHidden = modal.querySelector("#manual-status-pulang");
  const dendaMenitHidden = modal.querySelector("#manual-denda-menit");

  function resetFormFields() {
    if (statusSelect) statusSelect.value = "Hadir";
    if (jamMasukInput) jamMasukInput.value = "";
    if (jamPulangInput) jamPulangInput.value = "";
    if (pengantarSelect) {
      pengantarSelect.value = "";
      if (pengantarLainnyaInput) {
        pengantarLainnyaInput.value = "";
        pengantarLainnyaInput.style.display = "none";
      }
    }
    if (penjemputSelect) {
      penjemputSelect.value = "";
      if (penjemputLainnyaInput) {
        penjemputLainnyaInput.value = "";
        penjemputLainnyaInput.style.display = "none";
      }
    }
    if (alasanMasukInput) alasanMasukInput.value = "";
    if (alasanPulangInput) alasanPulangInput.value = "";
    if (catatanTextarea) catatanTextarea.value = "";
    if (statusPulangHidden) statusPulangHidden.value = "";
    if (dendaMenitHidden) dendaMenitHidden.value = "0";
  }

  function formatTimeForInput(val) {
    if (!val) return "";
    let clean = String(val).trim().replace(":", ".");
    return clean.slice(0, 5);
  }

  function populateCombo(selectElem, customInputElem, val) {
    if (!selectElem) return;
    if (!val) {
      selectElem.value = "";
      if (customInputElem) {
        customInputElem.value = "";
        customInputElem.style.display = "none";
      }
    } else if (val === "Ayah" || val === "Ibu") {
      selectElem.value = val;
      if (customInputElem) {
        customInputElem.value = "";
        customInputElem.style.display = "none";
      }
    } else {
      selectElem.value = "Lainnya";
      if (customInputElem) {
        customInputElem.value = val;
        customInputElem.style.display = "block";
      }
    }
  }

  let fetchSeq = 0;
  async function autofillAttendance() {
    const studentId = studentSelect ? studentSelect.value : "";
    const tanggal = dateInput ? dateInput.value.trim() : "";

    if (!studentId || !tanggal) {
      resetFormFields();
      return;
    }

    const currentSeq = ++fetchSeq;
    try {
      const res = await fetch(`/api/admin/absensi-detail?student_id=${encodeURIComponent(studentId)}&tanggal=${encodeURIComponent(tanggal)}`);
      if (currentSeq !== fetchSeq) return; // cegah bentrok async response
      if (!res.ok) {
        resetFormFields();
        return;
      }
      const json = await res.json();
      if (json.found && json.data) {
        const d = json.data;
        if (statusSelect) statusSelect.value = d.status || "Hadir";
        if (jamMasukInput) jamMasukInput.value = formatTimeForInput(d.waktu);
        if (jamPulangInput) jamPulangInput.value = formatTimeForInput(d.waktu_pulang);
        populateCombo(pengantarSelect, pengantarLainnyaInput, d.nama_pengantar);
        populateCombo(penjemputSelect, penjemputLainnyaInput, d.nama_penjemput);
        if (alasanMasukInput) alasanMasukInput.value = d.alasan_tanpa_kartu || "";
        if (alasanPulangInput) alasanPulangInput.value = d.alasan_penjemputan_tanpa_kartu || "";
        if (catatanTextarea) catatanTextarea.value = d.catatan || "";
        if (statusPulangHidden) statusPulangHidden.value = d.status_pulang || "";
        if (dendaMenitHidden) dendaMenitHidden.value = d.denda_menit || "0";
      } else {
        resetFormFields();
      }
    } catch (err) {
      console.warn("Gagal mengambil data absensi:", err);
    }
  }

  function openModal() {
    modal.showModal();
    if (studentSelect) {
      studentSelect.focus();
      if (studentSelect.value) {
        autofillAttendance();
      } else {
        resetFormFields();
      }
    }
  }

  function closeModal() {
    modal.close();
  }

  if (openBtn) openBtn.addEventListener("click", openModal);
  if (closeBtn) closeBtn.addEventListener("click", closeModal);
  if (cancelBtn) cancelBtn.addEventListener("click", closeModal);

  // Klik backdrop untuk menutup modal
  modal.addEventListener("click", (e) => {
    const rect = modal.getBoundingClientRect();
    const isInDialog = (
      rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
      rect.left <= e.clientX && e.clientX <= rect.left + rect.width
    );
    if (!isInDialog) {
      closeModal();
    }
  });

  // Helper Calendar Picker Mandiri
  function openCalendarPicker() {
    let picker = document.getElementById("standalone-native-picker");
    if (!picker) {
      picker = document.createElement("input");
      picker.type = "date";
      picker.id = "standalone-native-picker";
      picker.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;";
      document.body.appendChild(picker);
      picker.addEventListener("change", () => {
        if (picker.value) {
          const parts = picker.value.split("-");
          if (parts.length === 3) {
            const displayInput = document.getElementById("manual-tanggal-display");
            if (displayInput) {
              displayInput.value = `${parts[2]}/${parts[1]}/${parts[0]}`;
              autofillAttendance();
            }
          }
        }
      });
    }

    const currentDisplay = document.getElementById("manual-tanggal-display");
    if (currentDisplay && currentDisplay.value) {
      const parts = currentDisplay.value.trim().split(/[\/\-\.]/);
      if (parts.length === 3 && parts[2].length === 4) {
        picker.value = `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`;
      }
    }

    if (typeof picker.showPicker === "function") {
      picker.showPicker();
    } else {
      picker.click();
    }
  }

  if (calBtn) calBtn.addEventListener("click", openCalendarPicker);

  // Auto-fill saat pemilihan anak atau tanggal berubah
  if (studentSelect) {
    studentSelect.addEventListener("change", autofillAttendance);
  }
  if (dateInput) {
    dateInput.addEventListener("change", autofillAttendance);
    dateInput.addEventListener("blur", () => {
      if (dateInput.value.trim().length === 10) {
        autofillAttendance();
      }
    });
  }

  // Format Auto-Slash DD/MM/YYYY saat mengetik
  if (dateInput) {
    dateInput.addEventListener("input", (e) => {
      let val = e.target.value.replace(/[^\d]/g, "");
      if (val.length > 2 && val.length <= 4) {
        val = val.slice(0, 2) + "/" + val.slice(2);
      } else if (val.length > 4) {
        val = val.slice(0, 2) + "/" + val.slice(2, 4) + "/" + val.slice(4, 8);
      }
      e.target.value = val;
      if (val.length === 10) {
        autofillAttendance();
      }
    });
  }

  // Format Auto-Dot Jam 24 Jam (00.00 - 23.59)
  modal.querySelectorAll(".input-jam-24").forEach((input) => {
    input.addEventListener("input", (e) => {
      let val = e.target.value.replace(/[^\d]/g, "");
      if (val.length >= 2) {
        let jam = parseInt(val.slice(0, 2), 10);
        if (jam > 23) jam = 23;
        let jamStr = String(jam).padStart(2, "0");
        if (val.length > 2) {
          let mnt = parseInt(val.slice(2, 4), 10);
          if (mnt > 59) mnt = 59;
          let mntStr = String(mnt).padStart(2, "0");
          e.target.value = jamStr + "." + mntStr;
        } else {
          e.target.value = jamStr;
        }
      } else {
        e.target.value = val;
      }
    });
  });

  // Dropdown dengan input "Lainnya"
  modal.querySelectorAll(".dropdown-with-custom").forEach((container) => {
    const select = container.querySelector("select");
    const input = container.querySelector(".input-custom-text");
    if (!select || !input) return;

    select.addEventListener("change", () => {
      if (select.value === "Lainnya") {
        input.style.display = "block";
        input.focus();
      } else {
        input.style.display = "none";
        input.value = "";
      }
    });
  });
})();
</script>
