<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default("Admin") }} - Absensi TPA</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
  {% block styles %}{% endblock %}
  <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <h1>Absensi TPA</h1>
      </div>
      <div id="sidebar-scanner-box" style="background: rgba(255,255,255,0.7); border-radius: 8px; padding: 0.6rem 0.8rem; margin: -0.5rem 0 0.5rem 0; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
        <span id="scanner-operational-indicator" class="status-dot active"></span>
        <span style="font-weight: 600;" id="sidebar-scanner-status" class="scanner-operational-status">Memuat…</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin">Dashboard</a>
        <a href="/scan" target="_blank" rel="noopener">Buka Display Scanner</a>
        <a href="/admin/hari-ini">Absensi Hari Ini</a>
        <a href="/admin/santri">Data Murid</a>
        <a href="/admin/rekap">Rekap & Laporan</a>
        <a href="/admin/import">Impor Excel</a>
        <a href="/admin/fields">Pengaturan</a>
        <a href="/admin/gaya">Pratinjau Gaya</a>
      </nav>
    </aside>

    <main class="admin-main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', path='js/admin_scanner.js') }}?v=2"></script>
</body>
</html>
