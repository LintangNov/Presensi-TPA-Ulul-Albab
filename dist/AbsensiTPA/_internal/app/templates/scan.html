<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="scanner">
  <main>
    <header class="scanner-header">
      <h1>Absensi TPA</h1>
      <p id="scanner-status" class="status connected">Scanner aktif</p>
      <p class="hint">Tempelkan kartu pada reader USB.</p>
    </header>
    <section>
      <h2>Riwayat tap</h2>
      <ol id="tap-log" aria-live="polite"></ol>
    </section>
  </main>
  <div id="focus-warning" class="focus-warning" role="alert" hidden>
    <strong>SCANNER TIDAK AKTIF</strong>
    <span>Klik jendela ini untuk mengaktifkan kembali.</span>
  </div>
  <div id="feedback" class="feedback" role="status" aria-live="assertive" hidden>
    <strong id="feedback-title"></strong>
    <span id="feedback-message"></span>
  </div>
  <script src="/static/js/scanner.js"></script>
</body>
</html>
